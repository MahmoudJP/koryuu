<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- M monogram: three downstrokes = three languages -->
  <polyline points="150,360 150,150 256,272 362,150 362,360"
            fill="none" stroke="#ffffff" stroke-width="50"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- one baseline = "one story" -->
  <line x1="150" y1="398" x2="330" y2="398"
        stroke="#ffffff" stroke-opacity="0.32" stroke-width="14" stroke-linecap="round"/>

  <!-- accent period: the meem's head, and the ".jp" full stop -->
  <circle cx="366" cy="398" r="16" fill="url(#acc)"/>
</svg>
